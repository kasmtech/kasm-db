image: docker:28.2.2
services:
  - docker:28.2.2-dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_AUTH_CONFIG: ${_DOCKER_AUTH_CONFIG}

stages:
 - resolve
 - build
 - manifest

before_script:
  - docker login --username $DOCKER_HUB_USERNAME --password $DOCKER_HUB_PASSWORD
  - export SANITIZED_BRANCH="$(echo $CI_COMMIT_REF_NAME | sed -r 's#^release/##'  | sed 's/\//_/g')"
  - export SANITIZED_ROLLING_BRANCH=${SANITIZED_BRANCH}-rolling

# Resolves PG_VERSION/PG_SHA256/PGAUDIT_VERSION once per pipeline and publishes
# them as a dotenv artifact. Docker's layer cache is keyed on instruction text,
# not on what a RUN's network calls return, so a plain `docker build .` re-run
# without --no-cache would otherwise silently keep a stale resolved version.
# Resolving here and passing the values as --build-arg to every build job also
# guarantees the amd64 and arm64 legs land on identical versions, even if a new
# PostgreSQL/PGAudit release publishes mid-pipeline. PGAudit tags 1.x releases
# independently of the PostgreSQL major (1.6.x is the PG14-compatible series;
# it only started matching the PostgreSQL major number itself at PG16), hence
# the explicit series mapping below instead of a bare "${PG_MAJOR}.*" filter.
resolve-pg-versions:
  stage: resolve
  image: alpine:3.22
  services: []
  before_script: []
  script:
    - apk add --no-cache wget git
    - PG_MAJOR=14
    - PG_VERSION="$(wget -qO- https://ftp.postgresql.org/pub/source/ | grep -oE "href=\"v$PG_MAJOR\.[0-9]+/\"" | sed -E 's/href="v(.*)\/"/\1/' | sort -V | tail -1)"
    - test -n "$PG_VERSION"
    - PG_SHA256="$(wget -qO- "https://ftp.postgresql.org/pub/source/v$PG_VERSION/postgresql-$PG_VERSION.tar.bz2.sha256" | awk '{print $1}')"
    - test -n "$PG_SHA256"
    - git clone --quiet https://github.com/pgaudit/pgaudit.git /tmp/pgaudit
    - PGAUDIT_SERIES=1.6
    - PGAUDIT_VERSION="$(cd /tmp/pgaudit && git tag --list "${PGAUDIT_SERIES}.*" | grep -vE '(beta|rc)[0-9]*$' | sort -V | tail -1)"
    - test -n "$PGAUDIT_VERSION"
    - echo "PG_VERSION=$PG_VERSION" >> build.env
    - echo "PG_SHA256=$PG_SHA256" >> build.env
    - echo "PGAUDIT_VERSION=$PGAUDIT_VERSION" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env

build-container:
  stage: build
  needs: ["resolve-pg-versions"]
  script:
    - openssl req -x509 -nodes -days 1825 -newkey rsa:2048 -keyout db_server.key -out db_server.crt -subj "/C=US/ST=VA/L=None/O=None/OU=DoFu/CN=$(hostname)/emailAddress=none@none.none"
    - docker build
        --build-arg PG_VERSION=$PG_VERSION
        --build-arg PG_SHA256=$PG_SHA256
        --build-arg PGAUDIT_VERSION=$PGAUDIT_VERSION
        -t ${ORG_NAME}/postgres:$(arch)-$SANITIZED_BRANCH .
    - docker push ${ORG_NAME}/postgres:$(arch)-$SANITIZED_BRANCH
  only:
    - develop
    - /^release\/.*$/
  except:
    - schedules
  tags:
    - ${TAG}
  parallel:
    matrix:
      - TAG: [ oci-fixed-amd, oci-fixed-arm ]

manifest-container:
  stage: manifest
  script:
    - docker pull ${ORG_NAME}/postgres:x86_64-$SANITIZED_BRANCH
    - docker pull ${ORG_NAME}/postgres:aarch64-$SANITIZED_BRANCH
    - "docker manifest push --purge ${ORG_NAME}/postgres:$SANITIZED_BRANCH || :"
    - docker manifest create ${ORG_NAME}/postgres:$SANITIZED_BRANCH ${ORG_NAME}/postgres:x86_64-$SANITIZED_BRANCH ${ORG_NAME}/postgres:aarch64-$SANITIZED_BRANCH
    - docker manifest annotate ${ORG_NAME}/postgres:$SANITIZED_BRANCH ${ORG_NAME}/postgres:aarch64-$SANITIZED_BRANCH --os linux --arch arm64 --variant v8
    - docker manifest push --purge ${ORG_NAME}/postgres:$SANITIZED_BRANCH
  only:
    - develop
    - /^release\/.*$/
  except:
    - schedules
  tags:
    - oci-fixed-amd

